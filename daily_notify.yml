name: daily-notify

on:
  schedule:
    - cron: "0 23 * * *"   # 毎日 日本時間の朝8:00(UTCの23:00)。数分〜数十分遅れることがあります
  workflow_dispatch:        # 手動実行(Actionsタブの「Run workflow」)
    inputs:
      test:
        description: "テスト通知だけ送る(true / false)"
        default: "false"

permissions:
  contents: write           # 通知済みの記録(seen.json)を保存するため

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install requests beautifulsoup4 gspread

      - name: Run notifier
        env:
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          GOOGLE_ALERT_FEEDS: ${{ secrets.GOOGLE_ALERT_FEEDS }}
          KENSHO_SPREADSHEET_ID: ${{ secrets.KENSHO_SPREADSHEET_ID }}
          GSPREAD_JSON: ${{ secrets.GSPREAD_JSON }}
          NOTIFY_TEST: ${{ github.event.inputs.test }}
        run: python notify.py

      - name: Save results
        if: always()   # 通知に失敗しても、巡回結果は保存する
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in seen.json results.json; do if [ -f "$f" ]; then git add "$f"; fi; done
          git diff --cached --quiet || (git commit -m "update results" && git push)
